# 로컬 lite stack (D06 §11): PostgreSQL, Kafka 단일 broker(KRaft), ClickHouse, OTel Collector.
# 실행: make up PROFILE=lite  (versions.env + 루트 .env 를 env-file로 사용)
# 모든 포트는 127.0.0.1에만 바인딩한다. 로컬 전용이며 production 구성이 아니다
# (production은 Kafka RF3·min.insync=2, CH 복제, PG HA — ADR 0002, D04 §05).

name: montracer

services:
  postgres:
    image: ${POSTGRES_IMAGE:?versions.env 필요}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-montracer}
      # 소유자·migration 전용 계정. 애플리케이션은 아래 init에서 만드는 app role을 쓴다.
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-montracer_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?.env 필요 (make bootstrap)}
      MONTRACER_APP_USER: ${POSTGRES_USER:-montracer_app}
      MONTRACER_APP_PASSWORD: ${POSTGRES_PASSWORD:?.env 필요 (make bootstrap)}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: ${KAFKA_IMAGE:?versions.env 필요}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # 단일 broker라 RF1. production 값(RF3, min.insync=2)과 다르다 (ADR 0002).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      # 토픽은 코드/migration이 명시적으로 만든다.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # 설계 기준 retention 24시간 (D02 §04)
      KAFKA_LOG_RETENTION_HOURS: 24
    ports:
      - "127.0.0.1:${KAFKA_PORT:-19092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s

  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?versions.env 필요}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-montracer}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-montracer_app}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?.env 필요 (make bootstrap)}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d:/etc/clickhouse-server/config.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user $${CLICKHOUSE_USER} --password $${CLICKHOUSE_PASSWORD} --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30

  otel-collector:
    # 고객 측 Collector 역할 (D03 §03). ingress 구현 전까지 debug exporter로만 내보낸다.
    image: ${OTELCOL_IMAGE:?versions.env 필요}
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:${OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-14318}:4318"
      - "127.0.0.1:${OTELCOL_HEALTH_PORT:-13133}:13133"

volumes:
  postgres-data:
  kafka-data:
  clickhouse-data:

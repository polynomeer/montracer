# promtool test rules — 경보가 의도한 조건에서만 울리는지 검증한다.
rule_files:
  - montracer.rules.yml
evaluation_interval: 1m
tests:
  # Kafka 장애: 503 비율 10% → page
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="2xx"}'
        values: '0+90x20'
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="5xx"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MontracerIngressErrorRateHigh
        exp_alerts:
          - exp_labels: {severity: page, signal: traces}
            exp_annotations:
              summary: "Ingress traces 5xx 비율 10% (> 0.5%)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montraceringresserrorratehigh"

  # 정상: 5xx 0.1% → 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="2xx"}'
        values: '0+999x20'
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="5xx"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MontracerIngressErrorRateHigh
        exp_alerts: []

  # worker가 입력의 절반만 처리 → 처리율 저하
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x40'
      - series: 'montracer_worker_records_total{signal="traces",outcome="stored",reason=""}'
        values: '0+50x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerWorkerFallingBehind
        exp_alerts:
          - exp_labels: {severity: page, signal: traces}
            exp_annotations:
              summary: "Worker traces 처리율이 ingress 승인률보다 낮음 (10분)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerworkerfallingbehind"

  # worker 지표가 아예 없음(전부 다운) → 그래도 울린다
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="logs",outcome="accepted",reason=""}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerWorkerFallingBehind
        exp_alerts:
          - exp_labels: {severity: page, signal: logs}
            exp_annotations:
              summary: "Worker logs 처리율이 ingress 승인률보다 낮음 (10분)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerworkerfallingbehind"

  # worker가 따라잡고 있음(중복·quarantine 포함 같은 단위) → 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x40'
      - series: 'montracer_worker_records_total{signal="traces",outcome="stored",reason=""}'
        values: '0+95x40'
      - series: 'montracer_worker_records_total{signal="traces",outcome="duplicate",reason=""}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerWorkerFallingBehind
        exp_alerts: []

  # 적체 처리 중(commit 진행) 신선도 10분 → page
  - interval: 1m
    input_series:
      - series: 'montracer_worker_oldest_record_age_seconds{signal="metrics"}'
        values: '600x10'
      - series: 'montracer_worker_last_commit_timestamp_seconds'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: MontracerPipelineFreshnessLag
        exp_alerts:
          - exp_labels: {severity: page, signal: metrics}
            exp_annotations:
              summary: "metrics 수신→저장 지연 10m 0s (> 5분, 적체 처리 중)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerpipelinefreshnesslag"

  # 유휴: 마지막 batch 나이는 크지만 commit도 입력도 없음 → 신선도·정체 둘 다 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_worker_oldest_record_age_seconds{signal="metrics"}'
        values: '600x20'
      - series: 'montracer_worker_last_commit_timestamp_seconds'
        values: '0x20'
      - series: 'montracer_ingress_records_total{signal="metrics",outcome="accepted",reason=""}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerPipelineFreshnessLag
        exp_alerts: []
      - eval_time: 15m
        alertname: MontracerPipelineStalled
        exp_alerts: []

  # 정체: 입력은 계속되는데 commit이 멈춤(갱신 안 되는 gauge) → page
  - interval: 1m
    input_series:
      - series: 'montracer_worker_last_commit_timestamp_seconds'
        values: '0x20'
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerPipelineStalled
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "입력이 있는데 worker offset commit이 5분 넘게 없음"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerpipelinestalled"

  # worker 지표 자체가 없음(재시작 반복) + 입력 있음 → page
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerPipelineStalled
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "입력이 있는데 worker offset commit이 5분 넘게 없음"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerpipelinestalled"

  # ISR 저하 → page
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_under_replicated_partition{topic="telemetry.traces.raw.v1",partition="0"}'
        values: '1x10'
      - series: 'kafka_topic_partition_under_replicated_partition{topic="telemetry.traces.raw.v1",partition="1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: MontracerKafkaUnderReplicated
        exp_alerts:
          - exp_labels: {severity: page, topic: telemetry.traces.raw.v1}
            exp_annotations:
              summary: "telemetry.traces.raw.v1 under-replicated partition 1개 (ISR 저하 — acks=all append가 곧 실패할 수 있음)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerkafkaunderreplicated"

  # overrides 파일 오류 → ticket, 정상 reload는 안 울림
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_quota_overrides_reloads_total{outcome="error"}'
        values: '0 0 1 1 1'
      - series: 'montracer_ingress_quota_overrides_reloads_total{outcome="ok"}'
        values: '0 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: MontracerQuotaOverridesInvalid
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "tenant quota overrides 파일을 읽지 못함 (직전 한도 유지 중)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerquotaoverridesinvalid"

  # 1h rollup만 정체, 1m은 진행 중 → 1h만 page (max로 합쳐 가리지 않는다)
  - interval: 1m
    input_series:
      - series: 'montracer_rollup_last_success_timestamp_seconds{resolution="1h"}'
        values: '0x20'
      - series: 'montracer_rollup_last_success_timestamp_seconds{resolution="1m"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerMetricRollupStalled
        exp_alerts:
          - exp_labels: {severity: page, resolution: 1h}
            exp_annotations:
              summary: "metric 1h rollup이 5분 넘게 성공하지 못함 (집계 갱신 정지)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracermetricrollupstalled"

  # 1h job이 기동부터 한 번도 성공하지 못함(series는 0으로 미리 생성됨) → page
  - interval: 1m
    input_series:
      - series: 'montracer_rollup_last_success_timestamp_seconds{resolution="1h"}'
        values: '0x20'
    alert_rule_test:
      # time() − 0 > 300은 5분 뒤부터 참, for 5m을 지나 10분 이후 울린다
      - eval_time: 12m
        alertname: MontracerMetricRollupStalled
        exp_alerts:
          - exp_labels: {severity: page, resolution: 1h}
            exp_annotations:
              summary: "metric 1h rollup이 5분 넘게 성공하지 못함 (집계 갱신 정지)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracermetricrollupstalled"

  # trace 검사 1회 실패는 조용, 2회 연속이면 page. 다른 check는 정상이라 울리지 않는다.
  - interval: 1m
    input_series:
      - series: 'montracer_probe_consecutive_failures{check="trace"}'
        values: '0 1 2 2 0'
      - series: 'montracer_probe_consecutive_failures{check="ingest"}'
        values: '0 0 0 0 0'
    alert_rule_test:
      - eval_time: 1m
        alertname: MontracerSyntheticProbeFailing
        exp_alerts: []
      - eval_time: 2m
        alertname: MontracerSyntheticProbeFailing
        exp_alerts:
          - exp_labels: {severity: page, check: trace}
            exp_annotations:
              summary: "synthetic probe trace 검사가 2회 연속 실패"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracersyntheticprobefailing"
      - eval_time: 4m
        alertname: MontracerSyntheticProbeFailing
        exp_alerts: []

  # 마지막 결과(2m) 뒤 3분 초과(6m부터) + for 2m → 8m에 ticket. 7m에는 아직 아니다.
  - interval: 1m
    input_series:
      - series: 'montracer_probe_last_run_timestamp_seconds'
        values: '0 60 120 120x20'
    alert_rule_test:
      - eval_time: 5m
        alertname: MontracerSyntheticProbeNotRunning
        exp_alerts: []
      - eval_time: 7m
        alertname: MontracerSyntheticProbeNotRunning
        exp_alerts: []
      - eval_time: 8m
        alertname: MontracerSyntheticProbeNotRunning
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "synthetic probe 결과가 약 5분째 없음 (블랙박스 감시 공백)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracersyntheticprobenotrunning"

  # 첫 주기를 끝내지 못하고 재시작을 반복(last_run이 계속 0) → ticket
  - interval: 1m
    input_series:
      - series: 'montracer_probe_last_run_timestamp_seconds'
        values: '0x10'
    alert_rule_test:
      # promtool의 시각은 0에서 시작하므로 4m부터 > 180이 참이다(실제로는 기동 즉시 참). for 2m 뒤 6m
      - eval_time: 5m
        alertname: MontracerSyntheticProbeNotRunning
        exp_alerts: []
      - eval_time: 6m
        alertname: MontracerSyntheticProbeNotRunning
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "synthetic probe 결과가 약 5분째 없음 (블랙박스 감시 공백)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracersyntheticprobenotrunning"

  # probe 지표가 아예 없음(배포 누락) → ticket
  - interval: 1m
    input_series:
      - series: 'montracer_rollup_last_success_timestamp_seconds{resolution="1m"}'
        values: '0+60x20'
    alert_rule_test:
      - eval_time: 3m
        alertname: MontracerSyntheticProbeNotRunning
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "synthetic probe 결과가 약 5분째 없음 (블랙박스 감시 공백)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracersyntheticprobenotrunning"

  # redaction 실패는 RB03 경보로만 간다(RB01 probe 경보는 울리지 않음)
  - interval: 1m
    input_series:
      - series: 'montracer_probe_consecutive_failures{check="redaction"}'
        values: '0 1 2 3'
      - series: 'montracer_probe_consecutive_failures{check="isolation"}'
        values: '0 0 0 0'
    alert_rule_test:
      - eval_time: 2m
        alertname: MontracerSyntheticProbeFailing
        exp_alerts: []
      - eval_time: 2m
        alertname: MontracerSyntheticIsolationFailing
        exp_alerts: []
      - eval_time: 2m
        alertname: MontracerSyntheticRedactionFailing
        exp_alerts:
          - exp_labels: {severity: page, security: "true"}
            exp_annotations:
              summary: "synthetic probe의 PII 표본이 2회 연속 가려지지 않음 (redaction 정책 미적용 의심)"
              runbook_url: "docs/runbooks/RB03-pii-exposure-and-access-breach.md#montracersyntheticredactionfailing"

  - interval: 1m
    input_series:
      - series: 'montracer_probe_consecutive_failures{check="isolation"}'
        values: '0 2'
    alert_rule_test:
      - eval_time: 1m
        alertname: MontracerSyntheticIsolationFailing
        exp_alerts:
          - exp_labels: {severity: page, security: "true"}
            exp_annotations:
              summary: "다른 tenant key로 probe trace가 2회 연속 조회됨 (tenant 격리 위반 의심)"
              runbook_url: "docs/runbooks/RB03-pii-exposure-and-access-breach.md#montracersyntheticisolationfailing"

  # trace route의 요청이 모두 2.5~5초 bucket → p95 ≈ 4.875초 > 2초, 10분 지속 → page
  - interval: 1m
    input_series:
      - series: 'montracer_query_request_duration_seconds_bucket{route="GET /api/v1/traces/{trace_id}",le="2.5"}'
        values: '0x30'
      - series: 'montracer_query_request_duration_seconds_bucket{route="GET /api/v1/traces/{trace_id}",le="5"}'
        values: '0+60x30'
      - series: 'montracer_query_request_duration_seconds_bucket{route="GET /api/v1/traces/{trace_id}",le="+Inf"}'
        values: '0+60x30'
      - series: 'montracer_query_request_duration_seconds_count{route="GET /api/v1/traces/{trace_id}"}'
        values: '0+60x30'
    alert_rule_test:
      - eval_time: 5m
        alertname: MontracerQueryLatencyHigh
        exp_alerts: []
      - eval_time: 15m
        alertname: MontracerQueryLatencyHigh
        exp_alerts:
          - exp_labels: {severity: page, route: "GET /api/v1/traces/{trace_id}"}
            exp_annotations:
              summary: "조회 GET /api/v1/traces/{trace_id} p95 4.875s (> 2초, 10분)"
              runbook_url: "docs/runbooks/RB02-query-latency-and-cardinality.md#montracerquerylatencyhigh"

  # 같은 지연이라도 10분에 2건(분당 1건 미만)이면 울리지 않는다
  - interval: 1m
    input_series:
      - series: 'montracer_query_request_duration_seconds_bucket{route="POST /api/v1/query/metrics",le="2.5"}'
        values: '0x30'
      - series: 'montracer_query_request_duration_seconds_bucket{route="POST /api/v1/query/metrics",le="5"}'
        values: '0+0.2x30'
      - series: 'montracer_query_request_duration_seconds_bucket{route="POST /api/v1/query/metrics",le="+Inf"}'
        values: '0+0.2x30'
      - series: 'montracer_query_request_duration_seconds_count{route="POST /api/v1/query/metrics"}'
        values: '0+0.2x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerQueryLatencyHigh
        exp_alerts: []

  # series 상한 거절이 계속 → ticket. 다른 거절 사유(rate_limited)는 무관
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="metrics",outcome="rejected",reason="series_limit_exceeded"}'
        values: '0+10x40'
      - series: 'montracer_ingress_records_total{signal="metrics",outcome="rejected",reason="rate_limited"}'
        values: '0+10x40'
    alert_rule_test:
      - eval_time: 10m
        alertname: MontracerMetricCardinalityLimited
        exp_alerts: []
      - eval_time: 20m
        alertname: MontracerMetricCardinalityLimited
        exp_alerts:
          - exp_labels: {severity: ticket, reason: series_limit_exceeded}
            exp_annotations:
              summary: "metric series_limit_exceeded 거절이 15분째 계속됨 (cardinality 상한 도달 tenant 있음)"
              runbook_url: "docs/runbooks/RB02-query-latency-and-cardinality.md#montracermetriccardinalitylimited"

  # 거절 burst 한 번(series가 처음 생기고 2분간만 증가) → 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="metrics",outcome="rejected",reason="label_value_limit_exceeded"}'
        values: '_ _ 5 10 15 15x30'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerMetricCardinalityLimited
        exp_alerts: []

  # isolation이 계속 blocked·skipped(ok 증가 없음) → 30분 창 + for 10m 뒤 ticket. 정상 성공 중에는 무경보
  - interval: 1m
    input_series:
      - series: 'montracer_probe_checks_total{check="isolation",outcome="ok"}'
        values: '0+1x20 20x60'
    alert_rule_test:
      - eval_time: 30m
        alertname: MontracerSyntheticIsolationUnmonitored
        exp_alerts: []
      - eval_time: 65m
        alertname: MontracerSyntheticIsolationUnmonitored
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "synthetic probe의 tenant 격리 검사가 30분 넘게 성공하지 못함 (격리 감시 공백)"
              runbook_url: "docs/runbooks/RB03-pii-exposure-and-access-breach.md#montracersyntheticisolationunmonitored"

  # 다른 tenant key 미구성(ok series 없음) → ticket
  - interval: 1m
    input_series:
      - series: 'montracer_probe_checks_total{check="isolation",outcome="skipped"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MontracerSyntheticIsolationUnmonitored
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "synthetic probe의 tenant 격리 검사가 30분 넘게 성공하지 못함 (격리 감시 공백)"
              runbook_url: "docs/runbooks/RB03-pii-exposure-and-access-breach.md#montracersyntheticisolationunmonitored"

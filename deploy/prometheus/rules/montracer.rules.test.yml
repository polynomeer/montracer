# promtool test rules — 경보가 의도한 조건에서만 울리는지 검증한다.
rule_files:
  - montracer.rules.yml
evaluation_interval: 1m
tests:
  # Kafka 장애: 503 비율 10% → page
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="2xx"}'
        values: '0+90x20'
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="5xx"}'
        values: '0+10x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MontracerIngressErrorRateHigh
        exp_alerts:
          - exp_labels: {severity: page, signal: traces}
            exp_annotations:
              summary: "Ingress traces 5xx 비율 10% (> 0.5%)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montraceringresserrorratehigh"

  # 정상: 5xx 0.1% → 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="2xx"}'
        values: '0+999x20'
      - series: 'montracer_ingress_requests_total{signal="traces",status_class="5xx"}'
        values: '0+1x20'
    alert_rule_test:
      - eval_time: 12m
        alertname: MontracerIngressErrorRateHigh
        exp_alerts: []

  # worker가 입력의 절반만 처리 → 처리율 저하
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x40'
      - series: 'montracer_worker_records_total{signal="traces",outcome="stored",reason=""}'
        values: '0+50x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerWorkerFallingBehind
        exp_alerts:
          - exp_labels: {severity: page, signal: traces}
            exp_annotations:
              summary: "Worker traces 처리율이 ingress 승인률보다 낮음 (10분)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerworkerfallingbehind"

  # worker 지표가 아예 없음(전부 다운) → 그래도 울린다
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="logs",outcome="accepted",reason=""}'
        values: '0+100x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerWorkerFallingBehind
        exp_alerts:
          - exp_labels: {severity: page, signal: logs}
            exp_annotations:
              summary: "Worker logs 처리율이 ingress 승인률보다 낮음 (10분)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerworkerfallingbehind"

  # worker가 따라잡고 있음(중복·quarantine 포함 같은 단위) → 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x40'
      - series: 'montracer_worker_records_total{signal="traces",outcome="stored",reason=""}'
        values: '0+95x40'
      - series: 'montracer_worker_records_total{signal="traces",outcome="duplicate",reason=""}'
        values: '0+5x40'
    alert_rule_test:
      - eval_time: 25m
        alertname: MontracerWorkerFallingBehind
        exp_alerts: []

  # 적체 처리 중(commit 진행) 신선도 10분 → page
  - interval: 1m
    input_series:
      - series: 'montracer_worker_oldest_record_age_seconds{signal="metrics"}'
        values: '600x10'
      - series: 'montracer_worker_last_commit_timestamp_seconds'
        values: '0+60x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: MontracerPipelineFreshnessLag
        exp_alerts:
          - exp_labels: {severity: page, signal: metrics}
            exp_annotations:
              summary: "metrics 수신→저장 지연 10m 0s (> 5분, 적체 처리 중)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerpipelinefreshnesslag"

  # 유휴: 마지막 batch 나이는 크지만 commit도 입력도 없음 → 신선도·정체 둘 다 울리지 않음
  - interval: 1m
    input_series:
      - series: 'montracer_worker_oldest_record_age_seconds{signal="metrics"}'
        values: '600x20'
      - series: 'montracer_worker_last_commit_timestamp_seconds'
        values: '0x20'
      - series: 'montracer_ingress_records_total{signal="metrics",outcome="accepted",reason=""}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerPipelineFreshnessLag
        exp_alerts: []
      - eval_time: 15m
        alertname: MontracerPipelineStalled
        exp_alerts: []

  # 정체: 입력은 계속되는데 commit이 멈춤(갱신 안 되는 gauge) → page
  - interval: 1m
    input_series:
      - series: 'montracer_worker_last_commit_timestamp_seconds'
        values: '0x20'
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerPipelineStalled
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "입력이 있는데 worker offset commit이 5분 넘게 없음"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerpipelinestalled"

  # worker 지표 자체가 없음(재시작 반복) + 입력 있음 → page
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_records_total{signal="traces",outcome="accepted",reason=""}'
        values: '0+100x20'
    alert_rule_test:
      - eval_time: 15m
        alertname: MontracerPipelineStalled
        exp_alerts:
          - exp_labels: {severity: page}
            exp_annotations:
              summary: "입력이 있는데 worker offset commit이 5분 넘게 없음"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerpipelinestalled"

  # ISR 저하 → page
  - interval: 1m
    input_series:
      - series: 'kafka_topic_partition_under_replicated_partition{topic="telemetry.traces.raw.v1",partition="0"}'
        values: '1x10'
      - series: 'kafka_topic_partition_under_replicated_partition{topic="telemetry.traces.raw.v1",partition="1"}'
        values: '0x10'
    alert_rule_test:
      - eval_time: 8m
        alertname: MontracerKafkaUnderReplicated
        exp_alerts:
          - exp_labels: {severity: page, topic: telemetry.traces.raw.v1}
            exp_annotations:
              summary: "telemetry.traces.raw.v1 under-replicated partition 1개 (ISR 저하 — acks=all append가 곧 실패할 수 있음)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerkafkaunderreplicated"

  # overrides 파일 오류 → ticket, 정상 reload는 안 울림
  - interval: 1m
    input_series:
      - series: 'montracer_ingress_quota_overrides_reloads_total{outcome="error"}'
        values: '0 0 1 1 1'
      - series: 'montracer_ingress_quota_overrides_reloads_total{outcome="ok"}'
        values: '0 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: MontracerQuotaOverridesInvalid
        exp_alerts:
          - exp_labels: {severity: ticket}
            exp_annotations:
              summary: "tenant quota overrides 파일을 읽지 못함 (직전 한도 유지 중)"
              runbook_url: "docs/runbooks/RB01-kafka-backlog-and-store-failure.md#montracerquotaoverridesinvalid"

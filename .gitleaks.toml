# gitleaks 설정: 기본 규칙 + 의도된 가짜 값 허용 (D06 §11 "로컬 .env에는 가짜 credential만").
# tests/fixtures/pii 는 저장 계층 유출 검출용 가짜 secret·PII fixture이므로 제외한다.
[extend]
useDefault = true

[[allowlists]]
description = "환경 변수 이름(값이 아닌 승인 플래그). generic-api-key가 'API_..._OK=1'을 key로 오인한다 (ADR 0059 §3)"
regexTarget = "line"
regexes = [
  '''MONTRACER_API_BREAKING_OK''',
]

[[allowlists]]
description = "로컬 전용 가짜 credential과 가짜 PII fixture"
paths = [
  '''^\.env\.example$''',
  '''^tests/fixtures/pii/''',
]

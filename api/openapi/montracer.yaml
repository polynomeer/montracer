      x-montracer-service: control-api
      tags: [notifications]
      summary: 시험 알림 전송 요청 (D05 §09, ADR 0055)
      description: |
        policies.write(tenant 전체). 시험 알림을 쌓고 202를 돌려준다. 보내기는 alert-worker가 한다. 결과는 Location(GET …/tests/{test_id})에서 본다.
        진행 중인 시험이 있으면 그것을 돌려주고 `meta.warnings`에 `test_in_progress`가 있다. 꺼진 policy에도 보낸다. policy마다 1시간 20번을 넘으면 429다.
        같은 Idempotency-Key 재요청은 새로 쌓지 않고 저장된 응답을 그대로 돌려준다(D02 §20, ADR 0060).
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '202':
          description: 시험 전송이 쌓였다 (또는 진행 중인 것)
          headers:
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/NotificationTest'}
                  meta: {$ref: '#/components/schemas/ControlMeta'}

                properties:
                  data: {$ref: '#/components/schemas/Dashboard'}
                  meta: {$ref: '#/components/schemas/ControlMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      operationId: deleteDashboard
      x-montracer-service: control-api
      tags: [dashboards]
      summary: dashboard 삭제 (tombstone, ADR 0057)
      description: dashboards.write. If-Match는 선택이다 — 있으면 현재 revision이어야 한다(아니면 412).
      parameters:
        - name: If-Match
          in: header
          description: 읽은 revision의 ETag (선택)
          schema: {type: string, minLength: 1}
      responses:
        '204':
          description: 삭제됨
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: scope가 제한된 API key(machine) 또는 session token. OTLP ingest key는 쓸 수 없다 (D02 §12).
  parameters:
    From:
      name: from
      in: query
      required: true
      description: 구간 시작(포함), RFC3339 UTC
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      required: true
      description: 구간 끝(제외), RFC3339 UTC
      schema: {type: string, format: date-time}
    Limit:
      name: limit
      in: query
      description: page 크기 (기본 100, 최대 1,000)
      schema: {type: integer, minimum: 1, maximum: 1000}
    Cursor:
      name: cursor
      in: query
      description: 앞 응답의 `next_cursor`(서명, 15분). 같은 조건·같은 권한에서만 쓸 수 있다.
      schema: {type: string, minLength: 1}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 쓰기 POST의 멱등 key(24시간). 같은 key에 다른 본문은 409다 (D02 §20).
      schema: {type: string, minLength: 1, maxLength: 255}
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 읽은 revision의 ETag. 없으면 428, 다르면 412다 (D02 §20).
      schema: {type: string, minLength: 1}
  headers:
    ETag:
      description: 현재 revision. 수정·삭제의 If-Match에 그대로 쓴다.
      schema: {type: string}
    Location:
      description: 만든 자원의 경로
      schema: {type: string}
    RetryAfter:
      description: 다시 시도할 때까지 기다릴 초
      schema: {type: integer, minimum: 0}
    IdempotentReplayed:
      description: |
        같은 Idempotency-Key의 저장된 응답을 다시 돌려줬으면 `true`. 본문은 처음 응답 그대로라 `meta.request_id`는 처음 요청의 값이고,
        header `X-Request-ID`는 이 요청의 값이다 (ADR 0060 §5).
      schema: {type: string, enum: ['true']}
  responses:
    LogSearchResult:
      description: log 검색 결과
      content:
        application/json:
          schema:
            type: object
            required: [data, next_cursor, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/LogRow'}
              next_cursor: {$ref: '#/components/schemas/NextCursor'}
              meta: {$ref: '#/components/schemas/QueryMeta'}
    TraceSearchResult:
      description: trace 검색 결과
      content:
        application/json:
          schema:
            type: object
            required: [data, next_cursor, meta]
            properties:
              data:
                type: array
                items: {$ref: '#/components/schemas/TraceRow'}
              next_cursor: {$ref: '#/components/schemas/NextCursor'}
              meta: {$ref: '#/components/schemas/QueryMeta'}
    BadRequest:
      description: 타입·문법 오류. `details.field_violations`에 field 경로가 있다 (INVALID_ARGUMENT).
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Unauthorized:
      description: 인증 실패 (UNAUTHENTICATED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Forbidden:
      description: 작업 권한 없음 (FORBIDDEN)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    NotFound:
      description: 없거나 볼 수 없는 자원 (NOT_FOUND). 다른 tenant·권한 밖과 구별하지 않는다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Conflict:
      description: 상태 충돌, 같은 Idempotency-Key의 다른 본문 (CONFLICT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    PreconditionFailed:
      description: If-Match revision 불일치 (REVISION_MISMATCH). 최신을 다시 읽는다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    PreconditionRequired:
      description: If-Match가 없다 (INVALID_ARGUMENT, `details.field_violations[].field` = `If-Match`). revision 불일치(412)와 code로 구별된다.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    PayloadTooLarge:
      description: 본문 크기 초과
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Unprocessable:
      description: 지원하지 않는 의미, 실행 예산 초과 (INVALID_ARGUMENT, QUERY_BUDGET_EXCEEDED)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    TooManyRequests:
      description: tenant 동시 실행·quota 초과 (RATE_LIMITED)
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Internal:
      description: 서버 결함 (INTERNAL)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    Unavailable:
      description: 의존 서비스 실패 (UNAVAILABLE). `retryable`을 본다.
      headers:
        Retry-After: {$ref: '#/components/headers/RetryAfter'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
    QueryTimeout:
      description: 조회 시간 초과 (QUERY_TIMEOUT)
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorBody'}
  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/Error'}
    Error:
      type: object
      description: |
        오류 envelope (D02 §12, §19). SQL·stack·다른 tenant 존재는 담지 않는다.
        status와 code: 400·413 INVALID_ARGUMENT, 401 UNAUTHENTICATED, 403 FORBIDDEN, 404 NOT_FOUND, 409 CONFLICT, 410 EXPIRED,
        412 REVISION_MISMATCH, 428 INVALID_ARGUMENT(field `If-Match`), 422 INVALID_ARGUMENT·QUERY_BUDGET_EXCEEDED, 429 RATE_LIMITED, 500 INTERNAL, 503 UNAVAILABLE,
        504 QUERY_TIMEOUT (계약 시험이 강제한다).
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          enum: [INVALID_ARGUMENT, UNAUTHENTICATED, FORBIDDEN, NOT_FOUND, EXPIRED, CONFLICT, REVISION_MISMATCH,
            RATE_LIMITED, UNAVAILABLE, QUERY_TIMEOUT, QUERY_BUDGET_EXCEEDED, INTERNAL]
        message: {type: string}
        request_id: {type: string}
        retryable: {type: boolean}
        details:
          type: object
          description: code별 부가 정보. INVALID_ARGUMENT는 `field_violations`, 예산 초과는 한도 값(`max_range_seconds` 등).
          properties:
            field_violations:
              type: array
              items:
                type: object
                required: [field, reason]
                properties:
                  field: {type: string}
                  reason: {type: string}
          patternProperties:
            '': {}
    QueryMeta:
      type: object
      description: 조회 응답 meta (D02 §19). 계산하지 않는 값은 null이다 — 0이나 정상값으로 채우지 않는다.
      required: [request_id, schema_version, partial, failed_shards, watermark, sampled, coverage, resolution_seconds, scan_bytes, warnings]
      properties:
        request_id: {type: string}
        schema_version: {type: integer}
        partial: {type: boolean}
        failed_shards:
          type: array
          items: {type: string}
        watermark: {type: [string, 'null'], format: date-time}
        sampled: {type: [boolean, 'null']}
        coverage: {type: [number, 'null'], minimum: 0, maximum: 1}
        resolution_seconds: {type: [integer, 'null']}
        scan_bytes: {type: [integer, 'null']}
        warnings:
          type: array
          items: {type: string}
    ControlMeta:
      type: object
      description: 관리 API 응답 meta(조회·쓰기 공통). `warnings`는 처리는 됐지만 알릴 점이고, 없으면 빈 배열이다.
      required: [request_id, schema_version, warnings]
      properties:
        request_id: {type: string}
        schema_version: {type: integer}
        warnings:
          type: array
          items: {type: string}
    NextCursor:
      type: [string, 'null']
      description: 다음 page cursor. 더 없으면 null.
    TraceID:
      type: string
      pattern: '^[0-9a-f]{32}$'
      description: 소문자 hex 32자
    SpanID:
      type: string
      pattern: '^[0-9a-f]{16}$'
      description: 소문자 hex 16자
    AttributeMap:
      type: object
      description: OTel 속성(타입 보존, key는 속성 이름). JSON에 없는 NaN·±Inf는 문자열 "NaN"·"+Inf"·"-Inf"다.
      patternProperties:
        '': {}
    Trace:
      type: object
      required: [trace_id, spans, span_count, complete, reasons, last_updated_at]
      properties:
        trace_id: {$ref: '#/components/schemas/TraceID'}
        spans:
          type: array
          items: {$ref: '#/components/schemas/TraceSpan'}
        span_count: {type: integer, minimum: 0}
        complete:
          type: boolean
          description: 관측 범위 안의 구조가 완결됐는지. source의 모든 span 수집을 증명하지 않는다 (D02 §22).
        reasons:
          type: array
          items:
            type: string
            enum: [missing_root, missing_parent, span_limit_reached, payload_undecodable]
        last_updated_at: {type: string, format: date-time}
    TraceSpan:
      type: object
      required: [trace_id, span_id, parent_span_id, service_id, service_name, environment, name, kind, status_code, status_message,
        start_time, end_time, duration_ns, attributes, resource_attributes, events, links]
      properties:
        trace_id: {$ref: '#/components/schemas/TraceID'}
        span_id: {$ref: '#/components/schemas/SpanID'}
        parent_span_id:
          oneOf:
            - {$ref: '#/components/schemas/SpanID'}
            - {type: 'null'}
          description: root면 null
        service_id: {type: string, format: uuid}
        service_name: {type: string}
        environment: {type: [string, 'null'], description: resource에 없으면 null}
        name: {type: string}
        kind: {type: string}
        status_code: {type: string}
        status_message: {type: string}
        start_time: {type: string, format: date-time}
        end_time: {type: string, format: date-time}
        duration_ns: {type: integer, minimum: 0}
        attributes: {$ref: '#/components/schemas/AttributeMap'}
        resource_attributes: {$ref: '#/components/schemas/AttributeMap'}
        events:
          type: array
          items:
            type: object
            required: [name, time, attributes]
            properties:
              name: {type: string}
              time: {type: string, format: date-time}
              attributes: {$ref: '#/components/schemas/AttributeMap'}
        links:
          type: array
          items:
            type: object
            required: [trace_id, span_id, attributes]
            properties:
              trace_id: {$ref: '#/components/schemas/TraceID'}
              span_id: {$ref: '#/components/schemas/SpanID'}
              attributes: {$ref: '#/components/schemas/AttributeMap'}
    TimeRange:
      type: object
      description: '[from, to), RFC3339 UTC'
      required: [from, to]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
    FilterNode:
      type: object
      description: |
        filter AST (D02 §15). `and`·`or`는 `args`, 나머지는 `field`·`value`를 쓴다. 깊이 4·조건 20·`in` 값 100 이하.
        field·연산자는 signal별 catalog가 정한다(log: service_id, service.name, severity_number, trace_id, span_id, body, attributes.<key>).
      required: [op]
      properties:
        op:
          type: string
          enum: [and, or, eq, neq, in, exists, gt, gte, lt, lte, contains]
        args:
          type: array
          items: {$ref: '#/components/schemas/FilterNode'}
        field: {type: string}
        value: {}
    SearchRequest:
      type: object
      description: QuerySpec (D02 §19). `range`를 생략하면 최근 15분이다(다음 page도 첫 page 시각 기준).
      properties:
        signal:
          type: string
          description: '`metrics`는 MetricSearchRequest 본문이다(`POST /query`만).'
          enum: [logs, traces, errors]
        range: {$ref: '#/components/schemas/TimeRange'}
        filter: {$ref: '#/components/schemas/FilterNode'}
        projection:
          type: array
          description: 결과 field 부분집합. 생략하면 전부.
          items: {type: string}
        order:
          type: array
          maxItems: 1
          items:
            type: object
            required: [field]
            properties:
              field: {type: string, enum: [time, start_time]}
              direction: {type: string, enum: [desc]}
        limit: {type: integer, minimum: 1, maximum: 1000}
        cursor: {type: string}
        allow_partial: {type: boolean}
    LogRow:
      type: object
      description: log 결과 행. `projection`의 field만 담는다. 없는 trace·span ID는 null이다.
      properties:
        time: {type: string, format: date-time}
        event_id: {type: string}
        service_id: {type: string, format: uuid}
        severity_number: {type: integer, minimum: 0, maximum: 24}
        trace_id:
          oneOf:
            - {$ref: '#/components/schemas/TraceID'}
            - {type: 'null'}
        span_id:
          oneOf:
            - {$ref: '#/components/schemas/SpanID'}
            - {type: 'null'}
        body: {type: string}
        attributes:
          type: object
          patternProperties:
            '': {type: string}
    SearchResponse:
      type: object
      description: log·trace 검색 결과 (D02 §19 공통 성공 응답). 행은 `signal=logs`면 LogRow, `traces`면 TraceRow의 field다.
      required: [data, next_cursor, meta]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/SearchRow'}
        next_cursor: {$ref: '#/components/schemas/NextCursor'}
        meta: {$ref: '#/components/schemas/QueryMeta'}
    MetricSearchRequest:
      type: object
      description: "공통 검색의 metrics 본문 — MetricQueryRequest에 signal=metrics를 더한 것이다."
      required: [signal, range, expression]
      properties:
        signal: {type: string, const: metrics}
        range: {$ref: '#/components/schemas/TimeRange'}
        step_seconds: {type: integer, minimum: 0, description: 0이나 생략이면 범위로 정한다}
        expression: {$ref: '#/components/schemas/MetricExpression'}
    SearchRow:
      type: object
      description: 공통 검색(`POST /query`)의 행. signal에 따라 LogRow 또는 TraceRow의 field만 담는다(`projection` 부분집합).
      properties:
        time: {type: string, format: date-time}
        event_id: {type: string}
        service_id: {type: string, format: uuid}
        severity_number: {type: integer, minimum: 0, maximum: 24}
        trace_id:
          oneOf:
            - {$ref: '#/components/schemas/TraceID'}
            - {type: 'null'}
        span_id:
          oneOf:
            - {$ref: '#/components/schemas/SpanID'}
            - {type: 'null'}
        body: {type: string}
        attributes:
          type: object
          patternProperties:
            '': {type: string}
        start_time: {type: string, format: date-time}
        duration_ms: {type: number, minimum: 0}
        span_count: {type: integer, minimum: 0}
        has_error: {type: boolean}
        complete: {type: boolean}
        reasons:
          type: array
          items: {type: string, enum: [missing_root, missing_parent, span_limit_reached]}
        root_service: {type: [string, 'null']}
        root_service_id: {type: [string, 'null'], format: uuid}
        root_name: {type: [string, 'null']}
        last_updated_at: {type: string, format: date-time}
    TraceRow:
      type: object
      description: trace 검색 결과 행(trace 요약). `projection`의 field만 담는다.
      properties:
        trace_id: {$ref: '#/components/schemas/TraceID'}
        start_time: {type: string, format: date-time}
        duration_ms: {type: number, minimum: 0}
        span_count: {type: integer, minimum: 0}
        has_error: {type: boolean}
        complete: {type: boolean}
        reasons:
          type: array
          items: {type: string, enum: [missing_root, missing_parent, span_limit_reached]}
        root_service: {type: [string, 'null'], description: 서비스 catalog에 없으면 null}
        root_service_id: {type: [string, 'null'], format: uuid}
        root_name: {type: [string, 'null'], description: root span이 없으면 null}
        last_updated_at: {type: string, format: date-time}
    MetricQueryRequest:
      type: object
      required: [range, expression]
      properties:
        range: {$ref: '#/components/schemas/TimeRange'}
        step_seconds:
          type: integer
          minimum: 0
          description: 0이나 생략이면 범위로 정한다
        expression: {$ref: '#/components/schemas/MetricExpression'}
    MetricExpression:
      type: object
      description: '`filter`는 label 조건이다. 지금은 `and`와 `eq`만 실행한다(나머지는 422).'
      required: [metric, aggregation]
      properties:
        metric: {type: string, minLength: 1}
        aggregation:
          type: string
          enum: [rate, increase, sum, avg, min, max, count, hist_sum, p50, p90, p95, p99]
        filter: {$ref: '#/components/schemas/FilterNode'}
        group_by:
          type: array
          items: {type: string}
    MetricQueryResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [series, source_window_seconds, range]
          properties:
            series:
              type: array
              items: {$ref: '#/components/schemas/MetricSeries'}
            source_window_seconds: {type: integer, enum: [60, 3600], description: 계산에 쓴 rollup 해상도}
            range: {$ref: '#/components/schemas/TimeRange'}
        meta: {$ref: '#/components/schemas/QueryMeta'}
    MetricSeries:
      type: object
      required: [labels, unit, points, completeness, missing, flags]
      properties:
        labels:
          type: object
          patternProperties:
            '': {type: string}
        unit: {type: [string, 'null'], description: 단위가 섞였거나 모르면 null}
        points:
          type: array
          items:
            type: object
            required: [t, v, partial]
            properties:
              t: {type: string, format: date-time}
              v: {type: [number, 'null'], description: 값이 없으면 null(이유는 reason)}
              reason:
                type: string
                enum: [no_data, missing_baseline, not_applicable, bounds_mismatch, unit_conflict, type_conflict, pending]
              partial: {type: boolean}
        completeness: {type: number, minimum: 0, maximum: 1, description: 값이 있는 step / 전체 step}
        missing:
          type: array
          items: {$ref: '#/components/schemas/TimeRange'}
        flags:
          type: array
          items: {type: string}
    MetricItem:
      type: object
      required: [name, variants, conflict]
      properties:
        name: {type: string}
        conflict: {type: boolean, description: 같은 이름에 유형·단위가 다른 변형이 있다}
        variants:
          type: array
          items:
            type: object
            required: [type, temporality, monotonic, unit, series, last_seen, aggregations]
            properties:
              type: {type: string}
              temporality: {type: string}
              monotonic: {type: boolean}
              unit: {type: string}
              series: {type: integer, minimum: 0}
              last_seen: {type: string, format: date-time}
              aggregations:
                type: array
                items: {type: string}
    MetricLabelItem:
      type: object
      required: [key, sources, series]
      properties:
        key: {type: string}
        sources:
          type: array
          items: {type: string}
        series: {type: integer, minimum: 0}
    Service:
      type: object
      description: 서비스 catalog 항목 (D02 §08). 모르는 값·사용자가 정하지 않은 값은 null이다.
      required: [service_id, name, namespace, environment, language, status, first_seen, last_seen, owner_team, repository_url,
        runbook_url, tier, tags]
      properties:
        service_id: {type: string, format: uuid}
        name: {type: string}
        namespace: {type: string}
        environment: {type: string}
        language: {type: [string, 'null']}
        status:
          type: string
          enum: [active, inactive, archived]
          description: inactive는 24시간, archived는 30일 넘게 보지 못했다
        first_seen: {type: string, format: date-time}
        last_seen: {type: string, format: date-time}
        owner_team: {type: [string, 'null']}
        repository_url: {type: [string, 'null']}
        runbook_url: {type: [string, 'null']}
        tier: {type: [string, 'null']}
        tags:
          type: array
          items: {type: string}
    LowercaseUUID:
      type: string
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: 소문자 UUID

    # 자유 key map. strict 검사는 additionalProperties로 받은 key도 미선언으로 보므로 patternProperties로 선언한다.
    LabelMap:
      type: object
      description: label key → 값
      patternProperties:
        '^': {type: string}
      additionalProperties: false
    StateCountMap:
      type: object
      description: group 상태 → group 수
      patternProperties:
        '^': {type: integer, minimum: 0}
      additionalProperties: false
    JSONObject:
      type: object
      description: 임의 JSON 객체
      patternProperties:
        '^': {$ref: '#/components/schemas/JSONValue'}
      additionalProperties: false
    JSONValue:
      description: 임의 JSON 값 (객체 key는 모두 허용)
      patternProperties:
        '^': {$ref: '#/components/schemas/JSONValue'}
      additionalProperties: false
      items: {$ref: '#/components/schemas/JSONValue'}

    # ---- audit ----
    AuditEvent:
      type: object
      description: 감사 이벤트 (ADR 0034). details는 작성 시 PII·secret을 넣지 않은 저장값 그대로다.
      required: [id, occurred_at, category, action, actor_kind, actor_id, resource_type, resource_id, request_id, details]
      properties:
        id: {type: string}
        occurred_at: {type: string, format: date-time}
        category: {type: string, enum: [operations, security]}
        action: {type: string}
        actor_kind: {type: string, enum: [user, api_key, ingest_key, system, operator]}
        actor_id: {type: string, description: operator 행은 `montracer-operator`}
        resource_type: {type: string}
        resource_id: {type: string}
        request_id: {type: [string, 'null']}
        details: {$ref: '#/components/schemas/JSONObject'}

    # ---- monitors: 정의 ----
    LabelFilter:
      type: object
      description: 정규형 label 조건 AST (and / eq만, 깊이 4, leaf 20). 빈 field·value·args는 생략된다.
      required: [op]
      properties:
        op: {type: string, enum: [and, eq]}
        field: {type: string}
        value: {type: string}
        args:
          type: array
          items: {$ref: '#/components/schemas/LabelFilter'}
      additionalProperties: false
    LabelFilterInput:
      type: object
      description: 요청의 label 조건 AST. and는 args만, eq는 field와 value. 다른 op(or·not·in 등)는 422다.
      required: [op]
      properties:
        op: {type: string}
        field: {type: string}
        value: {type: [string, 'null']}
        args:
          type: [array, 'null']
          items: {$ref: '#/components/schemas/LabelFilterInput'}
      additionalProperties: false
    MonitorSpecInput:
      type: object
      description: |
        MonitorSpec 요청 (D02 §14, ADR 0049). 모르는 field는 400이다. 정규형(MonitorSpec)을 그대로 다시 보낼 수 있다.
        종류별 규칙(error_ratio의 threshold 0~1·aggregation 금지·minimum_requests, window·for·after_seconds의 evaluation 배수)은 서버가 검증한다.
      required: [name, query, window_seconds, evaluation_seconds, condition, for_seconds, no_data]
      properties:
        name: {type: string, description: '앞뒤 공백을 뺀 1..200자'}
        enabled: {type: [boolean, 'null'], description: 기본 true}
        query:
          type: object
          required: [kind]
          properties:
            kind: {type: string, enum: [metric, error_ratio]}
            metric: {type: [string, 'null'], description: 'metric은 필수(1..256 byte). error_ratio는 생략 또는 http.server.request.duration'}
            aggregation:
              type: [string, 'null']
              enum: [rate, increase, sum, avg, min, max, count, hist_sum, p50, p90, p95, p99, null]
              description: metric만 (필수). error_ratio는 null이거나 생략
            filter:
              oneOf:
                - {$ref: '#/components/schemas/LabelFilterInput'}
                - {type: 'null'}
            group_by:
              type: [array, 'null']
              maxItems: 5
              uniqueItems: true
              items: {type: string, minLength: 1, maxLength: 256}
          additionalProperties: false
        window_seconds: {type: integer, minimum: 60, maximum: 86400, multipleOf: 60}
        evaluation_seconds: {type: integer, enum: [30, 60, 300]}
        condition:
          type: object
          required: [operator, threshold]
          properties:
            operator: {type: string, enum: [gt, gte, lt, lte]}
            threshold: {type: number}
          additionalProperties: false
        minimum_requests: {type: [integer, 'null'], minimum: 0, maximum: 1000000000, description: 'error_ratio만 (기본 100)'}
        for_seconds: {type: integer, minimum: 0, maximum: 86400}
        recovery_evaluations: {type: [integer, 'null'], enum: [2, null], description: 'D02 §17로 2 고정. 다른 값은 422'}
        no_data:
          description: '결측 정책 (필수, 결측을 OK로 보는 선택지는 없다). 문자열 "no_data" / "alert_after_<초>s" 또는 객체'
          oneOf:
            - type: string
              pattern: '^(no_data|alert_after_[0-9]{1,6}s)$'
            - type: object
              required: [action]
              properties:
                action: {type: string, enum: [no_data, alert]}
                after_seconds: {type: [integer, 'null'], description: 'alert만 (필수, window_seconds..86400)'}
              additionalProperties: false
        notification_policy_id:
          oneOf:
            - {$ref: '#/components/schemas/LowercaseUUID'}
            - {type: 'null'}
      additionalProperties: false
    MonitorSpec:
      type: object
      description: 정규형 MonitorSpec. 기본값을 모두 채운 명시적 JSON이다 (ADR 0049).
      required: [name, enabled, query, window_seconds, evaluation_seconds, condition, minimum_requests, for_seconds, recovery_evaluations, no_data, notification_policy_id]
      properties:
        name: {type: string}
        enabled: {type: boolean}
        query:
          type: object
          required: [kind, metric, aggregation, filter, group_by]
          properties:
            kind: {type: string, enum: [metric, error_ratio]}
            metric: {type: string}
            aggregation:
              type: [string, 'null']
              enum: [rate, increase, sum, avg, min, max, count, hist_sum, p50, p90, p95, p99, null]
              description: error_ratio는 null
            filter:
              oneOf:
                - {$ref: '#/components/schemas/LabelFilter'}
                - {type: 'null'}
            group_by:
              type: array
              items: {type: string}
          additionalProperties: false
        window_seconds: {type: integer}
        evaluation_seconds: {type: integer, enum: [30, 60, 300]}
        condition:
          type: object
          required: [operator, threshold]
          properties:
            operator: {type: string, enum: [gt, gte, lt, lte]}
            threshold: {type: number}
          additionalProperties: false
        minimum_requests: {type: [integer, 'null'], description: 'error_ratio만, 그 밖은 null'}
        for_seconds: {type: integer}
        recovery_evaluations: {type: integer}
        no_data:
          type: object
          required: [action, after_seconds]
          properties:
            action: {type: string, enum: [no_data, alert]}
            after_seconds: {type: [integer, 'null'], description: 'alert만, 그 밖은 null'}
          additionalProperties: false
        notification_policy_id:
          oneOf:
            - {$ref: '#/components/schemas/LowercaseUUID'}
            - {type: 'null'}
      additionalProperties: false
    Monitor:
      type: object
      required: [id, name, enabled, revision, spec, created_at, updated_at, created_by, updated_by, status]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUUID'}
        name: {type: string}
        enabled: {type: boolean}
        revision: {type: integer, minimum: 1}
        spec: {$ref: '#/components/schemas/MonitorSpec'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_by: {type: string}
        status:
          description: 지금 상태 요약 (목록·단건만). 쓰기 응답과 상태 권한이 없을 때(status_forbidden)는 null
          oneOf:
            - {$ref: '#/components/schemas/MonitorStatus'}
            - {type: 'null'}

    # ---- monitors: 상태 (ADR 0054) ----
    MonitorStatus:
      type: object
      description: 상태 요약. 평가된 적 없음·꺼짐·결측·오류를 OK와 구분한다 (계약 6). stale은 평가가 멈췄다는 뜻이다.
      required: [state, groups_by_state, last_evaluation, stale]
      properties:
        state: {type: string, enum: [ALERT, EVALUATION_ERROR, NO_DATA, RECOVERING, PENDING, OK, NOT_EVALUATED, DISABLED]}
        groups_by_state: {$ref: '#/components/schemas/StateCountMap'}
        last_evaluation:
          oneOf:
            - {$ref: '#/components/schemas/MonitorEvaluation'}
            - {type: 'null'}
        stale: {type: boolean}
    MonitorEvaluation:
      type: object
      required: [slot, status, reason, window_start, window_end, groups, alerting, duration_ms]
      properties:
        slot: {type: string, format: date-time}
        status: {type: string, enum: [evaluated, no_data, error]}
        reason: {type: [string, 'null']}
        window_start: {type: [string, 'null'], format: date-time}
        window_end: {type: [string, 'null'], format: date-time}
        groups: {type: integer, minimum: 0}
        alerting: {type: integer, minimum: 0}
        duration_ms: {type: integer, minimum: 0}
    MonitorGroup:
      type: object
      required: [group_hash, labels, state, episode_id, episode_reason, violation_since, nodata_since, last_window_end, last_value, last_reason, updated_at]
      properties:
        group_hash: {type: string}
        labels: {$ref: '#/components/schemas/LabelMap'}
        state: {type: string, enum: [OK, PENDING, ALERT, RECOVERING, NO_DATA, EVALUATION_ERROR]}
        episode_id: {type: [string, 'null']}
        episode_reason: {type: [string, 'null']}
        violation_since: {type: [string, 'null'], format: date-time}
        nodata_since: {type: [string, 'null'], format: date-time}
        last_window_end: {type: [string, 'null'], format: date-time}
        last_value: {type: [number, 'null']}
        last_reason: {type: [string, 'null']}
        updated_at: {type: string, format: date-time}
    MonitorGroupsMeta:
      type: object
      description: ControlMeta + truncated (상한에서 잘렸는지)
      required: [request_id, schema_version, warnings, truncated]
      properties:
        request_id: {type: string}
        schema_version: {type: integer}
        warnings:
          type: array
          items: {type: string}
        truncated: {type: boolean}
    MonitorTransition:
      type: object
      required: [at, group_hash, labels, from, to, opened, closed, episode_id, reason, value]
      properties:
        at: {type: string, format: date-time}
        group_hash: {type: string}
        labels: {$ref: '#/components/schemas/LabelMap'}
        from: {type: string}
        to: {type: [string, 'null'], description: 정의 변경으로 끝난 상태는 null}
        opened: {type: boolean}
        closed: {type: boolean}
        episode_id: {type: [string, 'null']}
        reason: {type: [string, 'null']}
        value: {type: [number, 'null']}
    MonitorNotification:
      type: object
      required: [id, policy_id, event_type, renotify_sequence, group_hash, episode_id, status, attempts, last_status_code, last_error, created_at, finished_at]
      properties:
        id: {type: string}
        policy_id: {type: string}
        event_type:
          type: string
          pattern: '^alert\.[a-z]+(\.[0-9]+)?$'
          description: |
            지금 값은 `alert.opened`·`alert.resolved`·`alert.renotified`다. 이전 control-api(롤백)는 재알림을 저장 종류
            그대로(`alert.renotified.<n>`) 줄 수 있다 — client는 모르는 값을 원문으로 보인다.
        renotify_sequence: {type: [integer, 'null'], minimum: 1, description: '재알림 번호(1..3), 그 밖은 null'}
        group_hash: {type: string}
        episode_id: {type: string}
        status: {type: string, enum: [pending, delivered, failed, canceled]}
        attempts: {type: integer, minimum: 0}
        last_status_code: {type: [integer, 'null']}
        last_error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
    MonitorTimeline:
      type: object
      required: [from, to, evaluations, transitions, notifications, evaluations_truncated, transitions_truncated, notifications_truncated]
      properties:
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        evaluations:
          type: array
          items: {$ref: '#/components/schemas/MonitorEvaluation'}
        transitions:
          type: array
          items: {$ref: '#/components/schemas/MonitorTransition'}
        notifications:
          type: array
          items: {$ref: '#/components/schemas/MonitorNotification'}
        evaluations_truncated: {type: boolean}
        transitions_truncated: {type: boolean}
        notifications_truncated: {type: boolean}

    # ---- monitors: dry-run (ADR 0052) ----
    MonitorDryRun:
      type: object
      description: 지난 24시간 재평가. evaluations가 0이면 reason이 있다. 결측·오류를 발화 없음과 섞지 않는다 (계약 6).
      required: [from, to, warmup_seconds, data_until, step_seconds, evaluations, coverage, groups, groups_total, groups_omitted, reason]
      properties:
        from: {type: [string, 'null'], format: date-time, description: 첫 평가 시점(window 끝)}
        to: {type: [string, 'null'], format: date-time, description: 마지막 평가 시점}
        warmup_seconds: {type: integer, minimum: 0}
        data_until: {type: [string, 'null'], format: date-time, description: rollup watermark}
        step_seconds: {type: integer}
        evaluations: {type: integer, minimum: 0}
        coverage:
          type: object
          required: [evaluated, no_data, error]
          properties:
            evaluated: {type: integer, minimum: 0}
            no_data: {type: integer, minimum: 0}
            error: {type: integer, minimum: 0}
        groups:
          type: array
          maxItems: 100
          items: {$ref: '#/components/schemas/MonitorDryRunGroup'}
        groups_total: {type: integer, minimum: 0}
        groups_omitted: {type: integer, minimum: 0}
        reason: {type: string, enum: ['', no_watermark, stale_watermark, no_data]}
    MonitorDryRunGroup:
      type: object
      required: [group_key, labels, firing_intervals, firing_intervals_omitted, firing_seconds, final_state, evaluated, no_data, partial, first_value_at, max_value, last_value, last_reason, transitions]
      properties:
        group_key: {type: string}
        labels: {$ref: '#/components/schemas/LabelMap'}
        firing_intervals:
          type: array
          maxItems: 50
          items:
            type: object
            required: [start, end, reason]
            properties:
              start: {type: string, format: date-time}
              end: {type: [string, 'null'], format: date-time, description: dry-run 끝까지 열려 있으면 null}
              reason: {type: string, description: violation | no_data}
        firing_intervals_omitted: {type: integer, minimum: 0}
        firing_seconds: {type: integer, minimum: 0}
        final_state: {type: string, enum: [OK, PENDING, ALERT, RECOVERING, NO_DATA, EVALUATION_ERROR]}
        evaluated: {type: integer, minimum: 0}
        no_data: {type: integer, minimum: 0}
        partial: {type: integer, minimum: 0}
        first_value_at: {type: [string, 'null'], format: date-time}
        max_value: {type: [number, 'null']}
        last_value: {type: [number, 'null']}
        last_reason: {type: string, description: 마지막 시점에 값이 없던 이유. 값이 있었으면 빈 문자열}
        transitions: {type: integer, minimum: 0}

    # ---- notification policies (ADR 0053, 0055, 0056) ----
    NotificationPolicyCreate:
      type: object
      description: 생성 요청. 모르는 field는 400이다. 서명 secret은 서버가 만든다.
      required: [name, webhook]
      properties:
        name: {type: string, description: '앞뒤 공백을 뺀 1..200자'}
        webhook:
          type: object
          required: [url]
          properties:
            url: {type: string, maxLength: 2048, description: 'https 절대 URL. 공인 주소만, 자격 증명·fragment 금지 (SSRF 방어)'}
          additionalProperties: false
        enabled: {type: [boolean, 'null'], description: 기본 true}
      additionalProperties: false
    NotificationPolicyUpdate:
      type: object
      description: 수정 요청. webhook·enabled를 빼거나 null이면 저장된 값을 그대로 둔다 (ADR 0056).
      required: [name]
      properties:
        name: {type: string, description: '앞뒤 공백을 뺀 1..200자'}
        webhook:
          type: [object, 'null']
          required: [url]
          properties:
            url: {type: string, maxLength: 2048}
          additionalProperties: false
        enabled: {type: [boolean, 'null']}
      additionalProperties: false
    RotateSecretRequest:
      type: [object, 'null']
      properties:
        previous_secret_expires_in_seconds:
          type: [integer, 'null']
          minimum: 0
          maximum: 86400
          description: 이전 secret을 함께 서명할 기간 (기본 86400, 0이면 바로 폐기)
      additionalProperties: false
    NotificationPolicy:
      type: object
      required: [id, name, enabled, revision, webhook, created_at, updated_at, created_by, updated_by]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUUID'}
        name: {type: string}
        enabled: {type: boolean}
        revision: {type: integer, minimum: 1}
        webhook:
          type: object
          description: URL은 scheme·host만 보인다(path·query가 있으면 `/…`). 교체 겹침 기간에는 이전 secret id와 만료 시각이 있다.
          required: [url, signing_key_id, previous_signing_key_id, previous_signing_key_expires_at]
          properties:
            url: {type: string}
            signing_key_id: {type: string}
            previous_signing_key_id: {type: [string, 'null']}
            previous_signing_key_expires_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_by: {type: string}
    NotificationPolicyResponse:
      type: object
      required: [data, meta]
      properties:
        data: {$ref: '#/components/schemas/NotificationPolicy'}
        signing_secret:
          type: string
          description: 생성(재생 제외)·secret 교체 응답에만 있다. 다시 볼 수 없다.
        meta: {$ref: '#/components/schemas/ControlMeta'}
    NotificationTest:
      type: object
      required: [id, policy_id, status, attempts, last_status_code, last_error, created_at, finished_at]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUUID'}
        policy_id: {type: string}
        status: {type: string, enum: [pending, delivered, failed, canceled]}
        attempts: {type: integer, minimum: 0}
        last_status_code: {type: [integer, 'null']}
        last_error: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}

    # ---- dashboards (ADR 0057) ----
    DashboardSpecInput:
      type: object
      description: |
        DashboardSpec 요청 (D05 §11). 모르는 field는 400이다. 정규형(DashboardSpec)을 그대로 다시 보낼 수 있다.
        위젯마다 layout 하나, 24열 안, 겹치지 않음, 변수 참조("$이름")는 그 변수 종류의 field eq에만 — 서버가 검증한다.
      required: [title]
      properties:
        version: {type: [integer, 'null'], enum: [1, null]}
        title: {type: string, description: '앞뒤 공백을 뺀 1..200자'}
        description: {type: [string, 'null'], description: '0..2000자'}
        variables:
          type: [array, 'null']
          maxItems: 10
          items:
            type: object
            required: [name, kind]
            properties:
              name: {type: string, pattern: '^[a-z][a-z0-9_]{0,31}$'}
              kind: {type: string, enum: [environment, service], description: team은 422}
              default: {type: [string, 'null'], description: 'null이면 전체'}
            additionalProperties: false
        layout:
          type: [array, 'null']
          maxItems: 50
          items:
            type: object
            required: [widget_id, x, y, w, h]
            properties:
              widget_id: {type: string}
              x: {type: integer, minimum: 0, maximum: 23}
              y: {type: integer, minimum: 0, maximum: 1000}
              w: {type: integer, minimum: 1, maximum: 24}
              h: {type: integer, minimum: 1, maximum: 48}
            additionalProperties: false
        widgets:
          type: [array, 'null']
          maxItems: 50
          items:
            type: object
            required: [id, kind]
            properties:
              id: {type: string, pattern: '^[A-Za-z0-9_-]{1,64}$'}
              kind: {type: string, enum: [time_series, stat, table, top_list, text], description: histogram은 422}
              title: {type: [string, 'null']}
              unit: {type: [string, 'null']}
              display:
                type: [object, 'null']
                description: 종류가 쓰지 않는 field는 400 (time_series stack, stat decimals, table·top_list decimals·limit·sort)
                properties:
                  stack: {type: [boolean, 'null']}
                  decimals: {type: [integer, 'null'], minimum: 0, maximum: 6}
                  limit: {type: [integer, 'null'], minimum: 1, maximum: 100}
                  sort: {type: [string, 'null'], enum: [desc, asc, null]}
                additionalProperties: false
              time_override:
                type: [object, 'null']
                required: [range]
                properties:
                  range: {type: string, enum: [15m, 1h, 4h, 1d, 7d]}
                additionalProperties: false
              query:
                type: [object, 'null']
                description: text 위젯은 없어야 하고 그 밖은 필수
                properties:
                  metric: {type: [string, 'null']}
                  aggregation: {type: [string, 'null'], enum: [rate, increase, sum, avg, min, max, count, hist_sum, p50, p90, p95, p99, null]}
                  filter:
                    oneOf:
                      - {$ref: '#/components/schemas/LabelFilterInput'}
                      - {type: 'null'}
                  group_by:
                    type: [array, 'null']
                    maxItems: 5
                    items: {type: string}
                additionalProperties: false
              text: {type: [string, 'null'], description: 'text 위젯만 (1..10000자, 글자 그대로 표시)'}
            additionalProperties: false
      additionalProperties: false
    DashboardSpec:
      type: object
      description: 정규형 DashboardSpec. 기본값을 모두 채운다.
      required: [version, title, description, variables, layout, widgets]
      properties:
        version: {type: integer, enum: [1]}
        title: {type: string}
        description: {type: string}
        variables:
          type: array
          items:
            type: object
            required: [name, kind, default]
            properties:
              name: {type: string}
              kind: {type: string, enum: [environment, service]}
              default: {type: [string, 'null']}
            additionalProperties: false
        layout:
          type: array
          items:
            type: object
            required: [widget_id, x, y, w, h]
            properties:
              widget_id: {type: string}
              x: {type: integer}
              y: {type: integer}
              w: {type: integer}
              h: {type: integer}
            additionalProperties: false
        widgets:
          type: array
          items: {$ref: '#/components/schemas/DashboardWidget'}
      additionalProperties: false
    DashboardWidget:
      type: object
      required: [id, kind, title, unit, display, time_override, query, text]
      properties:
        id: {type: string}
        kind: {type: string, enum: [time_series, stat, table, top_list, text]}
        title: {type: string}
        unit: {type: [string, 'null']}
        display:
          type: object
          description: 그 종류가 쓰는 field만 있다 (time_series stack, stat decimals, table·top_list decimals·limit·sort, text 없음)
          properties:
            stack: {type: boolean}
            decimals: {type: integer}
            limit: {type: integer}
            sort: {type: string, enum: [desc, asc]}
          additionalProperties: false
        time_override:
          type: [object, 'null']
          required: [range]
          properties:
            range: {type: string, enum: [15m, 1h, 4h, 1d, 7d]}
          additionalProperties: false
        query:
          description: text 위젯은 null
          oneOf:
            - type: object
              required: [metric, aggregation, filter, group_by]
              properties:
                metric: {type: string}
                aggregation: {type: string, enum: [rate, increase, sum, avg, min, max, count, hist_sum, p50, p90, p95, p99]}
                filter:
                  oneOf:
                    - {$ref: '#/components/schemas/LabelFilter'}
                    - {type: 'null'}
                group_by:
                  type: array
                  items: {type: string}
              additionalProperties: false
            - {type: 'null'}
        text: {type: [string, 'null'], description: text 위젯만}
      additionalProperties: false
    DashboardSummary:
      type: object
      description: 목록 항목 (spec 없음)
      required: [id, title, revision, widget_count, created_at, updated_at, created_by, updated_by]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUUID'}
        title: {type: string}
        revision: {type: integer, minimum: 1}
        widget_count: {type: integer, minimum: 0}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_by: {type: string}
    Dashboard:
      type: object
      required: [id, title, revision, widget_count, spec, created_at, updated_at, created_by, updated_by]
      properties:
        id: {$ref: '#/components/schemas/LowercaseUUID'}
        title: {type: string}
        revision: {type: integer, minimum: 1}
        widget_count: {type: integer, minimum: 0}
        spec: {$ref: '#/components/schemas/DashboardSpec'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        created_by: {type: string}
        updated_by: {type: string}

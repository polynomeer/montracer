openapi: 3.1.0
info:
  title: Montracer API
  version: 1.0.0
  summary: 관리(control-api)·조회(query-api) API v1
  description: |
    Montracer 관리·조회 API의 기계 명세 원천이다 (D02 §12, §13, §19, §20, ADR 0059).
    - 경로는 `/api/v1` 기준이다. operation마다 `x-montracer-service`가 담당 service(`cmd/<service>`)를 적는다.
    - 시각은 RFC3339 UTC, 시간 구간은 `[from, to)`, 길이는 단위를 이름에 붙인다(`duration_ns`, `step_seconds`).
    - 모르는 값은 `null`이다. `null`, 빈 배열, `0`은 서로 다른 뜻이다 (D02 §12, 계약 6).
    - additive 필드는 v1에 추가할 수 있다. client는 모르는 필드를 무시해야 한다. 의미 변경은 v2로 나눈다.
    - 오류는 항상 `{"error": {...}}` envelope이다. 다른 tenant·권한 밖 자원은 없는 자원과 같은 404다.
    - 모든 응답에 `X-Request-ID`(서버 발급)가 있고, 오류 응답에는 `X-Content-Type-Options: nosniff`가 있다.
    - OTLP 수집(`/v1/traces|logs|metrics`, ingress)은 OTLP proto가 원천이라 이 문서에 없다 (api/README.md).
servers:
  - url: /
security:
  - bearer: []
tags:
  - name: query
    description: 조회 API (query-api)
  - name: services
    description: 서비스 catalog (query-api)
  - name: audit
    description: 감사 이벤트 (control-api)
  - name: monitors
    description: Monitor와 경보 상태 (control-api)
  - name: notifications
    description: 알림 policy (control-api)
  - name: dashboards
    description: Dashboard (control-api)
paths:
  # ---- query-api ----
  /api/v1/traces/{trace_id}:
    get:
      operationId: getTrace
      x-montracer-service: query-api
      tags: [query]
      summary: trace 단건 조회 (D02 §13, ADR 0022)
      description: |
        명시적 시간 경계(최대 7일)가 필요하다. 보이는 span이 없으면 404다 — 다른 tenant·권한 밖 trace와 없는 trace를 구별하지 않는다.
        environment 제한 key는 범위 밖 span을 보지 못하고, 그 자식은 `missing_parent`로 보인다.
      parameters:
        - name: trace_id
          in: path
          required: true
          schema: {$ref: '#/components/schemas/TraceID'}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: service_id
          in: query
          description: 이 서비스의 span만
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: trace
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Trace'}
                  meta: {$ref: '#/components/schemas/QueryMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/query:
    post:
      operationId: search
      x-montracer-service: query-api
      tags: [query]
      summary: 공통 검색 (D02 §19, ADR 0037·0043·0060)
      description: |
        `signal`은 `logs`·`traces`·`metrics`를 실행한다. `errors`는 아직 없어 422다.
        `metrics`는 metric 전용 확장(`expression`·`step_seconds`) 본문이고 `/query/metrics`와 같은 query·같은 결과다(D02 §19·§20).
        결과 행은 `projection`의 field만 담는다. 누적 10,000행을 넘으면 `meta.warnings`에 `interactive_row_limit_reached`가 붙고 멈춘다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/SearchRequest'}
                - {$ref: '#/components/schemas/MetricSearchRequest'}
      responses:
        '200':
          description: 검색 결과. log·trace는 행 목록과 cursor, metrics는 `/query/metrics`와 같은 series다.
          content:
            application/json:
              schema:
                oneOf:
                  - {$ref: '#/components/schemas/SearchResponse'}
                  - {$ref: '#/components/schemas/MetricQueryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/query/logs:
    post:
      operationId: searchLogs
      x-montracer-service: query-api
      tags: [query]
      summary: log 검색 (D02 §13, §19, ADR 0037·0039)
      description: 경로가 `signal=logs`를 정한다. 본문의 `signal`은 생략하거나 `logs`여야 한다. 정렬은 `time desc`만이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200': {$ref: '#/components/responses/LogSearchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/query/traces:
    post:
      operationId: searchTraces
      x-montracer-service: query-api
      tags: [query]
      summary: trace 검색 (D02 §13, §19, ADR 0043)
      description: 경로가 `signal=traces`를 정한다. 정렬은 `start_time desc`만이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SearchRequest'}
      responses:
        '200': {$ref: '#/components/responses/TraceSearchResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/query/metrics:
    post:
      operationId: queryMetrics
      x-montracer-service: query-api
      tags: [query]
      summary: metric 조회 (D02 §13, ADR 0027·0028)
      description: |
        비샘플링 metric rollup에서 계산한다. 값이 없는 step은 `v: null`과 `reason`이다 — 0으로 채우지 않는다(계약 6).
        histogram percentile은 bucket을 병합해 계산한다(평균하지 않는다, 계약 5). 범위는 최대 7일이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MetricQueryRequest'}
      responses:
        '200':
          description: series
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MetricQueryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/metrics:
    get:
      operationId: listMetrics
      x-montracer-service: query-api
      tags: [query]
      summary: metric 사전 (ADR 0046)
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: q
          in: query
          description: 이름 부분 문자열(대소문자 무시)
          schema: {type: string, maxLength: 256}
        - name: limit
          in: query
          description: page 크기 (기본 200, 최대 1,000)
          schema: {type: integer, minimum: 1, maximum: 1000}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: metric 이름과 유형별 변형
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/MetricItem'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
                  meta: {$ref: '#/components/schemas/QueryMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/metrics/labels:
    get:
      operationId: listMetricLabels
      x-montracer-service: query-api
      tags: [query]
      summary: metric label key (ADR 0046)
      parameters:
        - name: metric
          in: query
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
      responses:
        '200':
          description: label key
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [metric, keys]
                    properties:
                      metric: {type: string}
                      keys:
                        type: array
                        items: {$ref: '#/components/schemas/MetricLabelItem'}
                  meta: {$ref: '#/components/schemas/QueryMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/services:
    get:
      operationId: listServices
      x-montracer-service: query-api
      tags: [services]
      summary: 서비스 목록 (D02 §08, §13, ADR 0038)
      description: 이름 정규형·environment·service_id 순서다. environment 제한 key는 허용 environment의 서비스만 본다.
      parameters:
        - name: environment
          in: query
          schema: {type: string, maxLength: 255}
        - name: owner
          in: query
          description: owner_team
          schema: {type: string, maxLength: 255}
        - name: include_archived
          in: query
          description: 30일 넘게 보지 못한 서비스도 (기본 false)
          schema: {type: boolean}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 서비스
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Service'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
                  meta: {$ref: '#/components/schemas/QueryMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  /api/v1/services/{service_id}:
    get:
      operationId: getService
      x-montracer-service: query-api
      tags: [services]
      summary: 서비스 하나 (ADR 0042)
      parameters:
        - name: service_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 서비스
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Service'}
                  meta: {$ref: '#/components/schemas/QueryMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '504': {$ref: '#/components/responses/QueryTimeout'}
  # ---- control-api ----
  # ---- control-api ----
  /api/v1/audit-events:
    get:
      operationId: listAuditEvents
      x-montracer-service: control-api
      tags: [audit]
      summary: 감사 이벤트 조회 (D02 §14, ADR 0034)
      description: |
        (occurred_at, id) 내림차순. 구간은 최대 366일이다. 범주는 principal 권한으로 제한한다(ADR 0015 §4) — 볼 수 없는 범주를 요청하면 403이다.
        첫 page 시각을 snapshot으로 고정해 뒤 page에 새 행이 끼지 않는다. 플랫폼 운영자 행은 actor_id가 `montracer-operator`이고 승인자 ID를 지운다.
      parameters:
        - {$ref: '#/components/parameters/From'}
        - {$ref: '#/components/parameters/To'}
        - name: category
          in: query
          description: 이 범주만. 없으면 볼 수 있는 범주 전체
          schema: {type: string, enum: [operations, security]}
        - name: action
          in: query
          description: 정확히 일치하는 action (공백 없는 출력 가능 문자 최대 128 byte)
          schema: {type: string, maxLength: 128}
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: 감사 이벤트 page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/AuditEvent'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
                  meta: {$ref: '#/components/schemas/ControlMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/monitors/validate:
    post:
      operationId: validateMonitor
      x-montracer-service: control-api
      tags: [monitors]
      summary: monitor 정의 검증과 24시간 dry-run (D02 §20, ADR 0049, ADR 0052)
      description: |
        저장하지 않으므로 Idempotency-Key가 필요 없다. monitors.write(tenant 전체)가 필요하다.
        dry-run을 하지 못하면 `dry_run`은 null이고 `data.warnings`에 이유(dry_run_unavailable·dry_run_forbidden·dry_run_failed·dry_run_too_large·dry_run_busy)가 있다 — 그래도 200이다.
        형식 오류는 400, 문법은 맞지만 아직 지원하지 않는 의미뿐이면 422, 본문 64 KiB 초과는 413이다.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MonitorSpecInput'}
      responses:
        '200':
          description: 정규형 spec, 경고, dry-run 결과
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [normalized_spec, warnings, dry_run]
                    properties:
                      normalized_spec: {$ref: '#/components/schemas/MonitorSpec'}
                      warnings:
                        type: array
                        description: for_seconds_zero, minimum_requests_zero, evaluation_below_rollup_resolution, dry_run_* 등
                        items: {type: string}
                      dry_run:
                        oneOf:
                          - {$ref: '#/components/schemas/MonitorDryRun'}
                          - {type: 'null'}
                        description: 하지 못했으면 null (warnings에 이유). "발화 없음"과 구별한다 (계약 6)
                  meta: {$ref: '#/components/schemas/ControlMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/monitors:
    post:
      operationId: createMonitor
      x-montracer-service: control-api
      tags: [monitors]
      summary: monitor 생성 (D02 §14, §20, ADR 0049)
      description: |
        monitors.write(tenant 전체). 같은 Idempotency-Key·같은 본문의 재시도는 처음 응답(201)을 그대로 돌려주고 `Idempotent-Replayed: true`를 붙인다. 다른 본문은 409다.
        notification_policy_id가 같은 tenant의 살아 있는 policy가 아니면 400(field `notification_policy_id`)이다. 쓰기 응답의 `status`는 null이다.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MonitorSpecInput'}
      responses:
        '201':
          description: 만든 monitor (revision 1)
          headers:
            ETag: {$ref: '#/components/headers/ETag'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: '#/components/schemas/Monitor'}
                  meta: {$ref: '#/components/schemas/ControlMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '422': {$ref: '#/components/responses/Unprocessable'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}
    get:
      operationId: listMonitors
      x-montracer-service: control-api
      tags: [monitors]
      summary: monitor 목록 (이름순, D02 §14, ADR 0049, ADR 0054)
      description: |
        monitors.read. 항목마다 지금 상태 요약(`status`)을 싣는다. 상태를 볼 권한(tenant 전체 monitors.read + telemetry.read)이 없으면
        `status`가 null이고 `meta.warnings`에 `status_forbidden`이 있다 — 정의 목록은 그대로 200이다.
      parameters:
        - name: limit
          in: query
          description: page 크기 (기본 100, 최대 1,000, D02 §12)
          schema: {type: integer, minimum: 1, maximum: 1000}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: monitor page
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, meta]
                properties:
                  data:
                    type: array
                    items: {$ref: '#/components/schemas/Monitor'}
                  next_cursor: {$ref: '#/components/schemas/NextCursor'}
                  meta: {$ref: '#/components/schemas/ControlMeta'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '500': {$ref: '#/components/responses/Internal'}
        '503': {$ref: '#/components/responses/Unavailable'}

  /api/v1/monitors/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: monitor id (소문자 UUID)
        schema: {$ref: '#/components/schemas/LowercaseUUID'}
    get:
      operationId: getMonitor
      x-montracer-service: control-api
      tags: [monitors]
      summary: monitor 단건 (D02 §14, ADR 0049, ADR 0054)
      description: monitors.read. 없는·다른 tenant·삭제된 monitor는 같은 404다. 상태 권한이 없으면 `status` null + `status_forbidden` 경고.
      responses:
        '200':
          description: monitor
          headers:

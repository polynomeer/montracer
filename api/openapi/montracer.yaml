      tags: [notifications]
      summary: 서명 secret 교체 (Idempotency-Key·If-Match 필수, D02 §20, ADR 0055·0060)
      description: |
        policies.write(tenant 전체). 새 secret은 이 응답에서만 볼 수 있다.

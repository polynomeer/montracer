# PR·main CI (D06 §07). 외부 action은 commit SHA로 고정한다 (공급망, D04 §02).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  GOVULNCHECK_VERSION: v1.8.0
  GITLEAKS_VERSION: v8.30.1

jobs:
  go:
    name: go (vet · lint · test · vuln)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: detect go packages
        id: pkgs
        run: |
          if [ -n "$(go list ./... 2>/dev/null)" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "Go 패키지 없음 — vet/lint/test 건너뜀"; fi
      - name: gofmt
        if: steps.pkgs.outputs.present == 'true'
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then echo "gofmt 필요:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        if: steps.pkgs.outputs.present == 'true'
        run: go vet ./...
      - name: golangci-lint
        if: steps.pkgs.outputs.present == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: go test
        if: steps.pkgs.outputs.present == 'true'
        run: go test -race -count=1 ./...
      - name: govulncheck
        if: steps.pkgs.outputs.present == 'true'
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...

  go-integration:
    name: go integration (postgres)
    runs-on: ubuntu-24.04
    services:
      postgres:
        # deploy/compose/versions.env의 POSTGRES_IMAGE와 같은 digest (ADR 0013)
        image: postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_DB: montracer
          POSTGRES_USER: montracer_admin
          POSTGRES_PASSWORD: ci-only-admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U montracer_admin -d montracer"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: ci-only-admin
      ADMIN_DSN: postgres://montracer_admin:ci-only-admin@localhost:5432/montracer?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: versions.env와 service image 일치 확인
        run: grep -q 'postgres:17.11-trixie@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f' deploy/compose/versions.env
      - name: app role 생성 (로컬 init script와 동일 구성, ADR 0016 §2)
        run: |
          psql -h localhost -U montracer_admin -d montracer -v ON_ERROR_STOP=1 -c "
            CREATE ROLE montracer_rw NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            CREATE ROLE montracer_app LOGIN PASSWORD 'ci-only-app' NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS IN ROLE montracer_rw;"
      - name: PostgreSQL migrate up → down → up (재실행 가능성)
        run: |
          MONTRACER_MIGRATE_DSN="$ADMIN_DSN" go run ./cmd/migrate postgres up
          MONTRACER_MIGRATE_DSN="$ADMIN_DSN" go run ./cmd/migrate postgres down
          MONTRACER_MIGRATE_DSN="$ADMIN_DSN" go run ./cmd/migrate postgres up
      - name: ClickHouse 기동 (로컬 compose와 같은 config.d·init, ADR 0018)
        run: |
          image=$(grep '^CLICKHOUSE_IMAGE=' deploy/compose/versions.env | cut -d= -f2-)
          docker run -d --name ch -p 19000:9000 --ulimit nofile=262144:262144 \
            -e CLICKHOUSE_DB=montracer -e CLICKHOUSE_USER=montracer_admin -e CLICKHOUSE_PASSWORD=ci-only-admin \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 -e CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS=1 \
            -e MONTRACER_CH_INGEST_USER=montracer_ingest -e MONTRACER_CH_INGEST_PASSWORD=ci-only-ingest \
            -e MONTRACER_CH_QUERY_USER=montracer_query -e MONTRACER_CH_QUERY_PASSWORD=ci-only-query \
            -e MONTRACER_CH_ROLLUP_USER=montracer_rollup -e MONTRACER_CH_ROLLUP_PASSWORD=ci-only-rollup \
            -v "$PWD/deploy/compose/clickhouse/config.d:/etc/clickhouse-server/config.d:ro" \
            -v "$PWD/deploy/compose/clickhouse/init:/docker-entrypoint-initdb.d:ro" \
            "$image"
          scripts/dev/wait-clickhouse.sh ch montracer_query ci-only-query
      - name: Kafka 기동 (KRaft 단일 broker, 로컬 compose와 같은 설정) 과 topic 생성 (ADR 0020)
        run: |
          image=$(grep '^KAFKA_IMAGE=' deploy/compose/versions.env | cut -d= -f2-)
          docker run -d --name kafka -p 19192:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:19192 \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 -e KAFKA_AUTO_CREATE_TOPICS_ENABLE=false \
            "$image"
          for i in $(seq 1 60); do
            if MONTRACER_KAFKA_BROKERS=localhost:19192 MONTRACER_KAFKA_PARTITIONS=3 MONTRACER_KAFKA_REPLICATION=1 MONTRACER_KAFKA_ALLOW_LOW_REPLICATION=1 \
                go run ./cmd/migrate kafka up; then exit 0; fi
            sleep 2
          done
          docker logs kafka | tail -50; exit 1
      - name: ClickHouse migrate up → down → up
        env:
          MONTRACER_MIGRATE_CH_DSN: clickhouse://montracer_admin:ci-only-admin@localhost:19000/montracer
        run: |
          go run ./cmd/migrate clickhouse up
          go run ./cmd/migrate clickhouse down
          go run ./cmd/migrate clickhouse up
      - name: integration test
        env:
          MONTRACER_TEST_CH_ADMIN_DSN: clickhouse://montracer_admin:ci-only-admin@localhost:19000/montracer
          MONTRACER_TEST_CH_QUERY_DSN: clickhouse://montracer_query:ci-only-query@localhost:19000/montracer
          MONTRACER_TEST_CH_INGEST_DSN: clickhouse://montracer_ingest:ci-only-ingest@localhost:19000/montracer
          MONTRACER_TEST_CH_ROLLUP_DSN: clickhouse://montracer_rollup:ci-only-rollup@localhost:19000/montracer
          MONTRACER_TEST_KAFKA_BROKERS: localhost:19192
          MONTRACER_TEST_PG_APP_DSN: postgres://montracer_app:ci-only-app@localhost:5432/montracer?sslmode=disable
          MONTRACER_TEST_PG_ADMIN_DSN: ${{ env.ADMIN_DSN }}
        run: go test -race -count=1 -tags=integration ./...
      - name: dev → seed → seed(재실행) → smoke (D06 §11 make dev·seed·smoke)
        env:
          DEV_PG_APP_DSN: postgres://montracer_app:ci-only-app@localhost:5432/montracer?sslmode=disable
          DEV_KAFKA_BROKERS: localhost:19192
          DEV_CH_INGEST_DSN: clickhouse://montracer_ingest:ci-only-ingest@localhost:19000/montracer
          DEV_CH_QUERY_DSN: clickhouse://montracer_query:ci-only-query@localhost:19000/montracer
          DEV_CH_ROLLUP_DSN: clickhouse://montracer_rollup:ci-only-rollup@localhost:19000/montracer
          DEV_INGRESS_PORT: "18318"
          DEV_INGRESS_GRPC_PORT: "18317"
          DEV_QUERY_PORT: "18080"
          DEV_CONTROL_PORT: "18081"
          DEMO_PG_ADMIN_DSN: ${{ env.ADMIN_DSN }}
          DEMO_PG_APP_DSN: postgres://montracer_app:ci-only-app@localhost:5432/montracer?sslmode=disable
          DEMO_INGRESS_URL: http://127.0.0.1:18318
          DEMO_INGRESS_GRPC_ADDR: 127.0.0.1:18317
          DEMO_QUERY_URL: http://127.0.0.1:18080
          DEMO_CONTROL_URL: http://127.0.0.1:18081
          DEMO_SCENARIO: checkout
        run: |
          export DEV_PEPPER_HEX=$(scripts/dev/local-key.sh key-pepper) DEV_CURSOR_KEY_HEX=$(scripts/dev/local-key.sh cursor-key)
          export DEMO_PEPPER_HEX=$DEV_PEPPER_HEX DEMO_STATE_FILE=$RUNNER_TEMP/seed/demo.json
          scripts/dev/dev.sh > "$RUNNER_TEMP/dev.log" 2>&1 &
          for port in 18318 18080 18081; do
            for i in $(seq 1 60); do curl -sf "http://127.0.0.1:$port/healthz" >/dev/null && break; sleep 1; done
          done
          ok=0
          if go run ./scripts/dev/demo seed && go run ./scripts/dev/demo seed && go run ./scripts/dev/demo smoke; then ok=1; fi
          if [ "$ok" != 1 ]; then echo "--- dev.log (tail)"; tail -200 "$RUNNER_TEMP/dev.log"; exit 1; fi

  js:
    name: js (lint · typecheck · test · audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: dependency audit
        run: pnpm audit --audit-level high

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION} git --config .gitleaks.toml --redact --verbose --exit-code 1

  compose:
    name: compose config
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: validate lite stack
        run: |
          docker compose --env-file deploy/compose/versions.env --env-file .env.example \
            -f deploy/compose/compose.lite.yaml config -q
      - name: alert rules (promtool check + unit test, ADR 0023)
        run: make lint-alerts
      - name: images pinned by digest
        run: |
          if grep -E '^[A-Z_]+_IMAGE=' deploy/compose/versions.env | grep -v '@sha256:'; then
            echo "digest 없는 이미지가 있습니다 (ADR 0013)"; exit 1
          fi
          if grep -nE '^\s*image:\s*[^$[:space:]]' deploy/compose/*.yaml; then
            echo "compose 파일에 이미지를 직접 쓰지 말고 versions.env 변수를 쓰세요"; exit 1
          fi
